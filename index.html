  <script>
    (function () {
      var el = document.getElementById('splash'), seen = false, rm = false;
      try { seen = sessionStorage.getItem('pulse.splash') === '1'; sessionStorage.setItem('pulse.splash', '1'); } catch (e) {}
      try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (seen || rm || /[?&]nosplash/.test(location.search)) { el.remove(); return; }
      setTimeout(function () { el.classList.add('out'); }, 1200);
      setTimeout(function () { el.remove(); }, 1650);
    })();
  </script>
